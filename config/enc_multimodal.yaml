# Direction 1 (encoder) — full multimodal run, the headline Direction-1 result.
# Train once on tabular + text; integrate a held-out tabular set AND an image
# set (MVTec) with no heavy retraining.  Needs a GPU for the image backbone
# featurizer (submit_all.sh detects the image spec and requests one).
#   python -m src.experiment config/enc_multimodal.yaml
name: enc_multimodal
direction: encoder

train:
  - adbench:cardio
  - text:sci
test:
  - adbench:thyroid
  - spec: mvtec:bottle        # mapping form: extra keys go to the loader
    image_size: 224
    max_train: 100
    max_test: 80

adapt: [zero_shot, leaves]
seeds: [0, 1, 2]

vtree_methods: [chow_liu, spectral, orc, forman, random]

# feature baselines run everywhere; winclip/anomalyclip run only on the image
# test set and download CLIP weights on first use
baselines: [iforest, lof, knn, gmm, winclip, anomalyclip]

latent_dim: 64
n_sum_components: 3
epochs: 100
image_pretrained: true
