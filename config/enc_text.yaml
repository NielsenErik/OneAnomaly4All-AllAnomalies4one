# Direction 1 (encoder) — text hallucination/OOD transfer, full vtree sweep.
# 20-Newsgroups topic shift: in-distribution = sci.* , held-out = rec.* .
# The text featurizer (TF-IDF / embedding) maps strings into the shared latent.
#   python -m src.experiment config/enc_text.yaml
name: enc_text
direction: encoder

train:
  - text:sci
test:
  - text:rec

adapt: [zero_shot, leaves, finetune]
seeds: [0, 1, 2, 3, 4]

vtree_methods: [chow_liu, spectral, orc, forman, random]

# only feature baselines apply to text (winclip/anomalyclip are image-only and
# are auto-skipped for non-image modalities)
baselines: [iforest, lof, ocsvm, knn, gmm]

latent_dim: 64
n_sum_components: 3
epochs: 100
finetune_epochs: 10
