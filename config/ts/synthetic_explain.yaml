# Reference EXPLANATION run on the synthetic fleet — the control arm for the
# project's actual contribution.
#
# The claim this measures: exact attribution beats approximate attribution
# (0.90 vs 0.50 localisation AUROC against sampling-SHAP), completeness is a
# theorem (residual ~1e-5 nats, i.e. float32 round-off), and the marginal-vs-
# conditional gap on `desync` (0.55 vs 0.85 on the SAME circuit) is the single
# cleanest demonstration in the PoC.
#
# The shap-budget arm exists to kill the "you under-resourced the baseline"
# objection: quadrupling sampling-SHAP's budget moved it 0.4975 -> 0.5152, i.e.
# nowhere.
#
#   PYTHONPATH=. python -m poc.time_series.runner config/ts/synthetic_explain.yaml
name: synthetic_explain
description: |
  Correctness / completeness / faithfulness of exact circuit attribution vs
  Gaussian conditional, AE reconstruction, sampling-SHAP and z-score.

seeds: [0, 1, 2, 3, 4]
device: auto
stages: [explain]
log_root: logs/ts/synthetic_explain

dataset:
  source: synthetic
  units: 60
  channels: 14
  regimes: 3
  window: 8
  stride: 2
  inject_rate: 0.12

model:
  vtree: chain
  K: 6
  epochs: 40

eval:
  shapley_orders: 8
  deletion: true
  plots: true
  examples: true

grid:
  # the pre-registered robustness check on the weakest adversary
  eval.shap_samples: [32, 128]
