# Direction 2 (encoder-free) — multi-source routed mixture over RAW tabular.
# Two source modalities trained jointly (exact mixture density over the
# dimension-compatible sub-circuits), held-out set integrated by add_modality.
# Exercises the routed-mixture density and structure transfer across modalities.
#   python -m src.experiment config/ef_tabular_multisource.yaml
name: ef_tabular_multisource
direction: encoder_free

train:
  - adbench:cardio
  - adbench:thyroid
test:
  - adbench:breastw

adapt: [zero_shot, leaves, finetune]
seeds: [0, 1, 2, 3, 4]

baselines: []

n_sum_components: 3
epochs: 40
finetune_epochs: 10
vtree_method: chow_liu
