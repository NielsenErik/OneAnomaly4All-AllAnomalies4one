# Direction 1 (encoder) — multimodal, SOS / subtractive-mixture density.
# Same sources/held-out as enc_multimodal, squared PC mode. GPU for images.
#   python -m src.experiment config/enc_multimodal_sos.yaml
name: enc_multimodal_sos
direction: encoder

train:
  - adbench:cardio
  - text:sci
test:
  - adbench:thyroid
  - spec: mvtec:bottle
    image_size: 224
    max_train: 100
    max_test: 80

adapt: [zero_shot, leaves]
seeds: [0, 1, 2]

baselines: [iforest, lof, knn, gmm, winclip, anomalyclip]

latent_dim: 16
n_sum_components: 2
epochs: 100
use_sos: true
vtree_method: chow_liu
image_pretrained: true
