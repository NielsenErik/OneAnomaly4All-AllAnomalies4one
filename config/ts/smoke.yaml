# SMOKE TEST — every stage, one seed, tiny budget.  ~3-5 minutes on CPU.
#
# Purpose: prove the whole pipeline is wired before committing a workstation to
# an overnight batch.  It is NOT an experiment — the numbers mean nothing at
# this budget and must never be reported.
#
#   PYTHONPATH=. python -m poc.time_series.runner config/ts/smoke.yaml
name: smoke
description: |
  End-to-end wiring check: data -> circuit -> queries -> baselines -> conformal
  -> logs -> aggregation.  Fails loudly if anything in the chain is broken.

seeds: [0]
device: auto
evaluator: layered      # layered | recursive (same numbers; see bench_device)
stages: [ad, explain, rul, calibration]
log_root: logs/ts/smoke

dataset:
  source: synthetic
  units: 24
  channels: 8
  regimes: 2
  window: 6
  stride: 3
  rul_stride: 4
  censor_frac: 0.35
  bins: 12
  cap: 130

model:
  vtree: chain
  K: 4
  epochs: 6
  # NOT 6.  The tau coupling needs more epochs than the density does, and the
  # `predict` guardrail refuses a predictive whose E[tau|x] varies by less than
  # 5% of the target's own spread.  At K=4/deep/6 epochs it lands at sd 0.73
  # against a spread of 41.5 and the whole batch aborts at tier 0b — a true
  # positive about a model that is meaningless on purpose, which is not a thing
  # a wiring check should be asserting.  25 is the value
  # tests/test_rul_diagnostics.py::_fit already uses at the same K=4 and
  # tau_where='deep' on a task of this size, where it measures sd 19.3; the
  # guardrail's own wiring is covered there by
  # test_the_degeneracy_guardrail_catches_the_root_collapse, so smoke does not
  # need to double as that check.  Do not lower it without re-running the
  # rul stage.
  rul_epochs: 25

eval:
  fast_baselines: true       # skip IForest / GMM / conv-AE / Deep SVDD
  shapley_orders: 2
  shap_samples: 4
  max_explain_windows: 200
  n_complete: 16
  cal_frac: 0.35
  plots: false
  examples: true
