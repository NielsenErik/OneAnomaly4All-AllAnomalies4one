# Full multimodal run: tabular + text sources, image + tabular held out.
# MVTec downloads only the requested category (lazy, HF hub cache).
#   python -m src.experiment config/multimodal_demo.yaml
name: multimodal_demo

train:
  - adbench:cardio
  - text:sci
test:
  - adbench:thyroid
  - spec: mvtec:bottle        # mapping form: extra keys go to the loader
    image_size: 224
    max_train: 100
    max_test: 80

adapt: [zero_shot, leaves]
seeds: [0, 1, 2]

# feature baselines run everywhere; winclip/anomalyclip run only on the
# image test set (mvtec:bottle) and download CLIP weights on first use
baselines: [iforest, lof, knn, gmm, winclip, anomalyclip]

latent_dim: 64
n_sum_components: 3
epochs: 100
vtree_method: chow_liu
image_pretrained: true
