# Direction 1 (encoder) — text, SOS / subtractive-mixture density.
#   python -m src.experiment config/enc_text_sos.yaml
name: enc_text_sos
direction: encoder

train:
  - text:sci
test:
  - text:rec

adapt: [zero_shot, leaves]
seeds: [0, 1, 2, 3, 4]

baselines: [iforest, lof, knn, gmm]

latent_dim: 16
n_sum_components: 2
epochs: 100
use_sos: true
vtree_method: chow_liu
