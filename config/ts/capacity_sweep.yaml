# CAPACITY SWEEP — how much of the result is structure and how much is budget.
#
# The question a referee asks first: "is your circuit just bigger?".  This
# sweeps the two capacity knobs (mixture units per region K, components per
# leaf) at fixed structure and fixed epochs on real data, so the capacity curve
# can be reported next to the structure comparison.  If AUROC is flat in K, the
# capacity objection is answered; if it is not, the matched-budget claims in the
# structure ablation need K matched at the top of the curve, not at K=8.
#
# `leaf_components > 1` is included because it once HURT — before the leaf-
# jitter bug was fixed, GaussianMixtureLeaf siblings started identical and
# stayed identical.  It should now help or be neutral; if it hurts again, that
# is the same class of silent degeneracy resurfacing and must be chased, not
# tuned around.
#
#   PYTHONPATH=. python -m poc.time_series.runner config/ts/capacity_sweep.yaml
name: capacity_sweep
description: |
  K and leaf-components sweep at fixed structure/epochs on real C-MAPSS FD001.

seeds: [0, 1, 2]
device: auto
evaluator: layered      # layered | recursive (same numbers; see bench_device)
stages: [ad]
log_root: logs/ts/capacity_sweep
skip_if_missing_data: true

dataset:
  source: cmapss
  subset: FD001
  cap: 125
  window: 20
  stride: 2
  per_regime: auto
  max_test_windows: 8000

model:
  vtree: chain
  epochs: 50
  lr: 0.05

eval:
  baselines: false      # the sweep is circuit-vs-circuit
  missing: false
  typed: true

grid:
  model.K: [2, 4, 6, 8, 12, 16]
  model.leaf_components: [1, 3]
