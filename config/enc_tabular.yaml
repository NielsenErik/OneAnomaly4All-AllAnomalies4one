# Direction 1 (encoder) — tabular transfer, full vtree sweep.
# Train the shared latent PC once on cardio, integrate thyroid under every
# adaptation mode; one matched-budget run per vtree method.
#   local:  python -m src.experiment config/enc_tabular.yaml
#   slurm:  bash cluster_scripts/submit_all.sh config/enc_tabular.yaml
name: enc_tabular
direction: encoder

train:
  - adbench:cardio
test:
  - adbench:thyroid

adapt: [zero_shot, leaves, finetune]
seeds: [0, 1, 2, 3, 4]

# matched-budget structure ablation: identical capacity per method
vtree_methods: [chow_liu, spectral, orc, forman, random]

baselines: [iforest, lof, ocsvm, knn, gmm]

latent_dim: 32
n_sum_components: 3
epochs: 40
finetune_epochs: 10
