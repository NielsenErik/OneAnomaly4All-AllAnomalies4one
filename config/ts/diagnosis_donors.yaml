# Step 5 — matched versus unmatched donor context, as two arms of one study.
#
# The comparison IS the experiment: both arms use the same engines, the same
# splits, the same masks and the same corruption seed, and differ only in
# whether the donor window was matched to its recipient on operating regime and
# the frozen health proxy. The shortcut audit runs in both, on development
# units disjoint from the units it reports on, and its AUROC is the number that
# says how much marginal shortcut each arm still contains.
#
# This arm stays labelled SEMI-SYNTHETIC. Caliper matching on two covariates is
# not exact marginal preservation and an injected fault is not a physical one.
name: diagnosis_donors
description: Matched versus unmatched donor construction on held-out FD001 engines.
seeds: [11, 12, 13]
# CPU for the whole programme: the fitted comparators are float64 (MPS has
# no double), and a wall-time column is only comparable across arms measured
# on one device.
device: cpu
stages: [diagnosis]
log_root: logs/ts/diagnosis_donors
skip_if_missing_data: false
dataset:
  source: cmapss
  subset: FD001
  window: 20
  stride: 2
  val_units: 0.3
  cap: 125
model:
  vtree: channel_blocked
  K: 8
  leaf_components: 3
  epochs: 180
  min_epochs: 60
  patience: 30
  batch_size: 256
  lr: 0.02
variants:
  - name: unmatched
    eval: {diagnosis_donor_matching: false}
  - name: matched
    eval: {diagnosis_donor_matching: true}
  - name: matched_nearest
    eval: {diagnosis_donor_matching: true, diagnosis_donor_strategy: nearest}
  - name: matched_tight
    eval: {diagnosis_donor_matching: true, diagnosis_donor_caliper: 0.1}
eval:
  diagnosis_max_windows: 512
  diagnosis_alpha: 0.10
  diagnosis_shortcut_audit: true
  diagnosis_baselines: [gaussian, gmm]
  mask_ks: [1, 3, 7]
  masks_per_k: 1
  oracle_check_windows: 16
  plots: false
