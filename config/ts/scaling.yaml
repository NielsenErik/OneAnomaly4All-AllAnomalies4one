# LAYOUT SCALING — the engineering claim, already settled, kept reproducible.
#
# `DensityPC` builds a TREE, so a leaf position is instantiated K^depth times
# and a realistic window (8x14 = 112 features) needs ~1.8e6 leaf modules.
# `RegionGraphPC` builds each region once and shares it across the K parents
# that mix it: O(d*K^2).  All four circuit properties hold either way — this is
# a layout change, not a modelling change.
#
# Cheap (~1-2 min) and worth rerunning on the workstation so the table in the
# write-up is measured on the machine it claims to be measured on.
#
#   PYTHONPATH=. python -m poc.time_series.runner config/ts/scaling.yaml
name: scaling
description: Tree (DensityPC) vs DAG (RegionGraphPC) node counts, parameters and timings.

seeds: [0]
device: cpu              # a construction/size benchmark, not a training one
evaluator: layered      # layered | recursive (same numbers; see bench_device)
stages: [scaling]
log_root: logs/ts/scaling

model:
  K: 4

eval:
  scaling_dims: [8, 16, 32, 64, 112, 256, 1024]

grid:
  model.K: [4, 6]
