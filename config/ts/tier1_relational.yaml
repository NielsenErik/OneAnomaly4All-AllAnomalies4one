# TIER 1.3-1.6 — the method itself, on real C-MAPSS FD001.
#
# GATED: do not read anything here until `tier1_kill_gate` has returned PASS.
# If the blocked structure cannot hold density, these numbers describe a model
# nobody should be using, however good they look.
#
# What each stage row is, and what it is NOT:
#
#   two-pass vs 3C oracle     CORRECTNESS.  `relational_map` (one upward, one
#                             downward pass) against `typed_scores` (3·C full
#                             marginal queries).  They must agree to float32
#                             round-off.  This row is the correctness backbone
#                             of the method — if it moves, everything below it
#                             is void.  The speedup column is wall clock on
#                             THIS evaluator: the oracle runs on the compiled
#                             layer-parallel path and the two-pass on the
#                             per-node Python one, so the honest cost claim is
#                             the node-visit count, and the wall-clock crossover
#                             moves with C.  Both are logged.
#
#   dependence                the Tier 0 finding, re-measured here: a circuit
#                             that is exactly factorised across channels makes
#                             EVERY relational quantity identically zero while
#                             its training loss looks perfectly normal.  If this
#                             row is ~0 nats, the rest of the table is empty.
#
#   mask <name>               detection and localisation as sensors drop out,
#                             by exact marginalisation (no imputation).
#                             `loc_unfindable` counts windows whose corrupted
#                             channels are all dead — a property of the mask,
#                             reported so an aggressive mask cannot look easy.
#
#   subset search             Tier 1.5 against the per-candidate cost model
#                             (Lüdtke et al. 2022 re-implemented on THIS
#                             circuit, so the contrast is the algorithm and not
#                             the model class).  `value_max_abs_diff` must be
#                             round-off: same statistic, different cost.
#
#   calibration               Tier 1.6.  The column that matters is
#                             worst_abs_drift_masked vs worst_abs_drift_blind:
#                             how far the false-alarm rate wanders from alpha
#                             when sensors drop out, with and without per-mask
#                             thresholds.
#
#   PYTHONPATH=. python -m poc.time_series.runner config/ts/tier1_relational.yaml
name: tier1_relational
description: |
  Tier 1.3-1.6: two-pass relational map, arbitrary missing-sensor masks,
  subset search and mask-conditional calibration on real C-MAPSS FD001.

seeds: [0, 1, 2]
device: auto
evaluator: layered
stages: [relational]
log_root: logs/ts/tier1_relational
skip_if_missing_data: true

dataset:
  source: cmapss
  subset: FD001
  cap: 125
  window: 20
  stride: 2
  per_regime: auto
  val_units: 0.2
  max_test_windows: 8000

model:
  vtree: channel_blocked        # REQUIRED by the stage; anything else is refused
  K: 8
  leaf_components: 3
  epochs: 60          # past the factorisation crossover — see tier1_kill_gate
  lr: 0.05

eval:
  baselines: false
  max_explain_windows: 1500
  oracle_check_windows: 64
  oracle_tolerance: 1.0e-3
  mask_ks: [1, 2, 3]
  masks_per_k: 2
  subset_windows: 128
  subset_masks: 2
  subset_max_size: 3
  subset_beam: 4
  subset_naive_baseline: true
  relational_alpha: 0.05
