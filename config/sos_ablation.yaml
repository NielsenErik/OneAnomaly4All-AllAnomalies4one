# Ablation: SOS (squared / subtractive-mixture) density vs the monotone path
# on the same data — copy this file with use_sos: false to compare.
#   python -m src.experiment config/sos_ablation.yaml
name: sos_ablation

train:
  - adbench:cardio
test:
  - adbench:thyroid

adapt: [zero_shot, leaves]
seeds: [0, 1, 2, 3, 4]

latent_dim: 16            # SOS partition is quadratic in K per vtree node
n_sum_components: 2
epochs: 40
use_sos: true
vtree_method: chow_liu
